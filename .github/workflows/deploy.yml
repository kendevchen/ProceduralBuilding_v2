# Build with Vite and publish to GitHub Pages:
#   main            -> https://kendevchen.github.io/ProceduralBuilding_v2/
#   interior-floors -> https://kendevchen.github.io/ProceduralBuilding_v2/dev/  (development preview)
#   feature/room-editor -> https://kendevchen.github.io/ProceduralBuilding_v2/room-editor/
# A push to a listed branch rebuilds all previews, since Pages publishes one site.
# (Pages must be set to "GitHub Actions" as its source, not "Deploy from a branch".)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, interior-floors, feature/room-editor]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - name: Check out the development branch
        id: dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: interior-floors
          path: dev
      - name: Build the development preview under /dev/
        if: steps.dev.outcome == 'success'
        working-directory: dev
        run: |
          npm ci
          npx vite build --base /ProceduralBuilding_v2/dev/ --outDir ../main/dist/dev
      - name: Check out the room editor branch
        uses: actions/checkout@v4
        with:
          ref: feature/room-editor
          path: room-editor
      - name: Build the room editor preview under /room-editor/
        working-directory: room-editor
        run: |
          npm ci
          npx vite build --base /ProceduralBuilding_v2/room-editor/ --outDir ../main/dist/room-editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
